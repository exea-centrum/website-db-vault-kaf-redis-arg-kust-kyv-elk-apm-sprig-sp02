# Wymaga kube-prometheus-stack (patrz scripts/bootstrap-monitoring.sh).
# Label release: prometheus dopasowuje domyslny selektor operatora.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastapi-web-app
  namespace: davtro02
  labels: { release: prometheus }
spec:
  selector:
    matchLabels: { app: fastapi-web-app }
  namespaceSelector:
    matchNames: [davtro02]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
