# Vault PKI remains the CA for external TLS and the Istio mesh CA bridge.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    server: https://vault.davtro02.svc.cluster.local:8203
    path: pki/sign/davtro-ingress
    caProvider:
      type: Secret
      name: vault-tls
      key: ca.crt
    auth:
      tokenSecretRef:
        name: cert-manager-vault-token
        key: token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-istio-ca-issuer
spec:
  vault:
    server: https://vault.davtro02.svc.cluster.local:8203
    path: pki/sign/davtro-istio-ca
    caProvider:
      type: Secret
      name: vault-tls
      key: ca.crt
    auth:
      tokenSecretRef:
        name: cert-manager-vault-token
        key: token
