# Istio Ingress Gateway replaces Kubernetes Ingress/ingress-nginx.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: davtro-gateway
  namespace: davtro02
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https-davtro
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: davtro-tls
      hosts:
        - davtro.local
    - port:
        number: 443
        name: https-spark
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: spark-tls
      hosts:
        - spark.davtro.local
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: davtro-routes
  namespace: davtro02
spec:
  hosts:
    - davtro.local
  gateways:
    - davtro-gateway
  http:
    - match:
        - uri: { prefix: /api }
      route:
        - destination:
            host: fastapi-web-app-svc
            port: { number: 80 }
    - match:
        - uri: { prefix: /grafana }
      route:
        - destination:
            host: grafana
            port: { number: 3000 }
    - match:
        - uri: { prefix: /kafka-ui }
      route:
        - destination:
            host: kafka-ui
            port: { number: 80 }
    - match:
        - uri: { prefix: /pgadmin }
      route:
        - destination:
            host: pgadmin
            port: { number: 80 }
    - route:
        - destination:
            host: frontend-svc
            port: { number: 80 }
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: spark-routes
  namespace: davtro02
spec:
  hosts:
    - spark.davtro.local
  gateways:
    - davtro-gateway
  http:
    - route:
        - destination:
            host: spark-master-svc
            port: { number: 8082 }
