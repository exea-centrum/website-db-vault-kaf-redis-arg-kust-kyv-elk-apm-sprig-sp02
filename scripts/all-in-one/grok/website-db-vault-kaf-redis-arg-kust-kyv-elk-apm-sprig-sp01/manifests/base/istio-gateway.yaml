# =============================================================================
# Istio Ingress Gateway + VirtualServices + PeerAuthentication (mTLS STRICT)
# Zastępuje klasyczny Ingress (nginx) + aplikacyjne certy mTLS.
# Wymaga: Istio zainstalowanego w klastrze (istiod + istio-ingressgateway).
# TLS zewnętrzny: Secret davtro-tls / spark-tls (cert-manager + Vault PKI).
# =============================================================================
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: davtro-gateway
  namespace: davtro02
  labels:
    app: davtro
spec:
  # Używa standardowego istio-ingressgateway z namespace istio-system.
  # Jeśli masz własny gateway, zmień selector.
  selector:
    istio: ingressgateway
  servers:
    # HTTPS – terminacja TLS na Gateway (cert z cert-manager / Vault PKI)
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: davtro-tls          # Secret type kubernetes.io/tls w tym samym ns
      hosts:
        - davtro.local
    # HTTP → redirect na HTTPS
    - port:
        number: 80
        name: http
        protocol: HTTP
      tls:
        httpsRedirect: true
      hosts:
        - davtro.local
    # Spark UI – osobny host
    - port:
        number: 443
        name: https-spark
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: spark-tls
      hosts:
        - spark.davtro.local
    - port:
        number: 80
        name: http-spark
        protocol: HTTP
      tls:
        httpsRedirect: true
      hosts:
        - spark.davtro.local
---
# VirtualService – routing L7 dla głównej aplikacji
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: davtro-vs
  namespace: davtro02
spec:
  hosts:
    - davtro.local
  gateways:
    - davtro-gateway
  http:
    # API (FastAPI)
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: fastapi-web-app-svc
            port:
              number: 80
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
    # Grafana
    - match:
        - uri:
            prefix: /grafana
      route:
        - destination:
            host: grafana
            port:
              number: 3000
    # Kafka UI
    - match:
        - uri:
            prefix: /kafka-ui
      route:
        - destination:
            host: kafka-ui
            port:
              number: 80
    # pgAdmin
    - match:
        - uri:
            prefix: /pgadmin
      route:
        - destination:
            host: pgadmin
            port:
              number: 80
    # Frontend (SPA) – catch-all na końcu
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend-svc
            port:
              number: 80
---
# VirtualService – Spark Master UI
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: spark-vs
  namespace: davtro02
spec:
  hosts:
    - spark.davtro.local
  gateways:
    - davtro-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: spark-master-svc
            port:
              number: 8082
---
# PeerAuthentication – wymusza STRICT mTLS wewnątrz namespace (Envoy ↔ Envoy)
# Aplikacje wysyłają zwykły HTTP/TCP; Envoy transparentnie szyfruje (TLS 1.3).
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: davtro02
spec:
  mtls:
    mode: STRICT
---
# AuthorizationPolicy – przykładowa (pozwala cały ruch wewnątrz mesh + z gateway)
# Można zawęzić do konkretnych SPIFFE identities / pathów HTTP.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-mesh-and-gateway
  namespace: davtro02
spec:
  action: ALLOW
  rules:
    # Ruch z Istio Ingress Gateway
    - from:
        - source:
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
    # Ruch wewnątrz namespace (wszystkie SA)
    - from:
        - source:
            namespaces: ["davtro02"]
