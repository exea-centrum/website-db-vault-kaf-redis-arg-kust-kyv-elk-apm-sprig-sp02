# ISTIO: zastepuje ingress-nginx (Ingress davtro-ingress + spark-ingress).
# TLS terminuje Istio Ingress Gateway (istio-system) certem z cert-managera (Secret davtro-gateway-tls,
# patrz manifests/istio-system/). Routing - te same sciezki co w dawnym Ingressie.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: davtro-gateway
  namespace: davtro02
spec:
  selector:
    istio: ingressgateway
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts: ["davtro.local", "spark.davtro.local"]
      tls:
        httpsRedirect: true
    - port: { number: 443, name: https, protocol: HTTPS }
      hosts: ["davtro.local", "spark.davtro.local"]
      tls:
        mode: SIMPLE
        credentialName: davtro-gateway-tls
        minProtocolVersion: TLSV1_2
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: davtro-routes
  namespace: davtro02
spec:
  hosts: ["davtro.local"]
  gateways: ["davtro-gateway"]
  http:
    # kolejnosc ma znaczenie: od najbardziej szczegolowych, "/" na koncu
    - match: [{ uri: { prefix: /api } }]
      route: [{ destination: { host: fastapi-web-app-svc, port: { number: 80 } } }]
    - match: [{ uri: { prefix: /grafana } }]
      route: [{ destination: { host: grafana, port: { number: 3000 } } }]
    - match: [{ uri: { prefix: /kafka-ui } }]
      route: [{ destination: { host: kafka-ui, port: { number: 80 } } }]
    - match: [{ uri: { prefix: /pgadmin } }]
      route: [{ destination: { host: pgadmin, port: { number: 80 } } }]
    - route: [{ destination: { host: frontend-svc, port: { number: 80 } } }]
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: spark-routes
  namespace: davtro02
spec:
  hosts: ["spark.davtro.local"]
  gateways: ["davtro-gateway"]
  http:
    - route: [{ destination: { host: spark-master-svc, port: { number: 8082 } } }]
