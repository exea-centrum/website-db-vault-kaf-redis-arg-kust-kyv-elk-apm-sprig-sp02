# Certy dla Ingress Gateway (Istio) - TLS zewnetrzny.
# mTLS aplikacji jest w 100% po stronie Istio (SPIFFE), te certy nie maja z nim nic wspolnego.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: davtro-tls
  namespace: davtro02
spec:
  secretName: davtro-tls
  duration: 2160h
  renewBefore: 360h
  commonName: davtro.local
  dnsNames:
    - davtro.local
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spark-tls
  namespace: davtro02
spec:
  secretName: spark-tls
  duration: 2160h
  renewBefore: 360h
  commonName: spark.davtro.local
  dnsNames:
    - spark.davtro.local
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
