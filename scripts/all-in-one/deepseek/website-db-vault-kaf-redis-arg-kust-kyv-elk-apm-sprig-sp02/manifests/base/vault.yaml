apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: davtro02
data:
  config-tls.hcl: |
    disable_mlock = true
    ui = true
    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-0"
    }
    listener "tcp" {
      address         = "0.0.0.0:8203"
      cluster_address = "0.0.0.0:8201"
      tls_cert_file     = "/vault/tls/tls.crt"
      tls_key_file      = "/vault/tls/tls.key"
      tls_client_ca_file = "/vault/tls/ca.crt"
      tls_disable_client_certs = true
      tls_min_version   = "tls12"
    }
    telemetry {
      prometheus_retention = "12h"
      unauthenticated_metrics_access = true
      disable_hostname = true
    }
  start.sh: |
    set -eu
    test -s /vault/tls/tls.crt
    test -s /vault/tls/tls.key
    test -s /vault/tls/ca.crt
    echo "Vault: start TLS :8203"
    exec vault server -config=/vault/config/config-tls.hcl
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: davtro02
spec:
  serviceName: vault
  replicas: 1
  selector: { matchLabels: { app: vault } }
  template:
    metadata:
      labels: { app: vault }
    spec:
      serviceAccountName: davtro-sa
      securityContext:
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-data-permissions
          image: hashicorp/vault:1.17
          command: ["sh", "-c", "chown -R 100:1000 /vault/data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          volumeMounts:
            - name: vault-data
              mountPath: /vault/data
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          command: ["sh", "/vault/config/start.sh"]
          ports:
            - { containerPort: 8201, name: raft }
            - { containerPort: 8203, name: https }
          env:
            - name: VAULT_API_ADDR
              value: https://vault-0.vault.davtro02.svc.cluster.local:8203
            - name: VAULT_CLUSTER_ADDR
              value: http://vault-0.vault.davtro02.svc.cluster.local:8201
          readinessProbe:
            httpGet:
              path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=204"
              port: 8203
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=204"
              port: 8203
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: vault-data
              mountPath: /vault/data
            - name: config
              mountPath: /vault/config
            - name: vault-tls
              mountPath: /vault/tls
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: vault-config }
        - name: vault-tls
          secret: { secretName: vault-tls }
  volumeClaimTemplates:
    - metadata: { name: vault-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: davtro02
spec:
  selector: { app: vault }
  ports:
    - { name: raft, port: 8201, targetPort: 8201 }
    - { name: https, port: 8203, targetPort: 8203 }
