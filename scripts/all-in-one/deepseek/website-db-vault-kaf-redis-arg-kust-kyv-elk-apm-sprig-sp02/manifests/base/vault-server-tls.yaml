# Bootstrap TLS dla serwera Vault - NIE z Vault PKI (błędne koło).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-selfsigned
  namespace: davtro02
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: davtro02
spec:
  secretName: vault-ca
  isCA: true
  commonName: davtro-vault-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Never
  usages:
    - digital signature
    - cert sign
    - crl sign
  issuerRef:
    name: vault-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-ca
  namespace: davtro02
spec:
  ca:
    secretName: vault-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: davtro02
spec:
  secretName: vault-tls
  duration: 720h
  renewBefore: 168h
  commonName: vault.davtro02.svc
  dnsNames:
    - vault
    - vault.davtro02
    - vault.davtro02.svc
    - vault.davtro02.svc.cluster.local
    - vault-0.vault.davtro02.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: vault-ca
    kind: Issuer
    group: cert-manager.io
