apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-backup
  namespace: davtro02
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: microk8s-hostpath
  resources: { requests: { storage: 2Gi } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-snapshot
  namespace: davtro02
spec:
  schedule: "0 3 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels: { app: vault-snapshot }
        spec:
          serviceAccountName: davtro-sa
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: snapshot
              image: hashicorp/vault:1.17
              env:
                - name: VAULT_ADDR
                  value: https://vault.davtro02.svc.cluster.local:8203
                - name: VAULT_CACERT
                  value: /etc/vault-tls/ca.crt
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  export VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login jwt="$SA_TOKEN" role=davtro-snapshot)"
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  vault operator raft snapshot save "/backup/snapshot-${STAMP}.snap"
                  find /backup -name 'snapshot-*.snap' -mtime +14 -delete
                  echo "OK: snapshot-${STAMP}.snap"
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: vault-tls
                  mountPath: /etc/vault-tls
                  readOnly: true
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 200m, memory: 128Mi }
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: vault-backup
            - name: vault-tls
              secret: { secretName: vault-tls, optional: true }
