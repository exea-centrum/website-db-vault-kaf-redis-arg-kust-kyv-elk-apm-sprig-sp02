# KROK 3.5 (v4): pelna automatyzacja bootstrapu Vaulta.
#
# Deployment z petla self-heal co 60s.
#
# Funkcje:
#   1. brak inicjalizacji -> vault operator init (1 key share / 1 threshold)
#      -> unseal_key + root_token zapisane na PVC /vault/data/bootstrap-keys
#      -> plik chmod 600
#   2. sealed -> automatyczny unseal z bootstrap-keys
#   3. audit -> stdout
#   4. KV v2:
#        davtro/db
#        davtro/smtp
#        davtro/auth
#   5. Kubernetes Auth:
#        davtro-apps
#        davtro-snapshot
#        cert-manager
#        cert-manager-internal
#        davtro-transit
#        davtro-mtls
#   6. Database Engine + dynamic credentials:
#        database/config/davtro-postgresql
#        database/roles/davtro-app-rw
#   7. synchronizacja hasla PostgreSQL <-> Vault KV
#   8. automatyczne ALTER TABLE bookings
#   9. Vault PKI:
#        pki/
#        role davtro-ingress
#        role davtro-istio-ca
#   10. Vault Transit:
#        transit/keys/davtro-app
#   11. Vault mTLS policy
#   12. brak hooka ArgoCD - zwykly Deployment
#
# Wymagane:
#   - PVC vault-data-vault-0
#   - Secret vault-tls utworzony przez cert-manager
#   - ServiceAccount davtro-sa
#   - postgres-db-0
#
# UWAGA:
# `vault-tls` NIE jest tworzony przez Vault.
# Musi powstac z bootstrapowego CA cert-managera przed uruchomieniem Vaulta.

apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-bootstrap-sql
  namespace: davtro02
data:

  # ---------------------------------------------------------------------------
  # Vault Database Engine - creation statement
  # ---------------------------------------------------------------------------
  creation.sql: |
    CREATE ROLE "{{name}}"
      WITH LOGIN
      PASSWORD '{{password}}'
      VALID UNTIL '{{expiration}}'
      NOINHERIT;

    GRANT USAGE, CREATE ON SCHEMA public TO "{{name}}";

    GRANT SELECT, INSERT, UPDATE, DELETE
      ON ALL TABLES IN SCHEMA public
      TO "{{name}}";

    GRANT USAGE, SELECT
      ON ALL SEQUENCES IN SCHEMA public
      TO "{{name}}";

    GRANT "{{name}}" TO davtro WITH ADMIN OPTION;

  # ---------------------------------------------------------------------------
  # Vault Database Engine - revocation statement
  # ---------------------------------------------------------------------------
  revocation.sql: |
    REASSIGN OWNED BY "{{name}}" TO davtro;
    DROP OWNED BY "{{name}}";
    DROP ROLE IF EXISTS "{{name}}";

  # ---------------------------------------------------------------------------
  # ESO / aplikacje
  # ---------------------------------------------------------------------------
  davtro-apps.hcl: |
    path "davtro/data/*" {
      capabilities = ["read"]
    }

    path "database/creds/davtro-app-rw" {
      capabilities = ["read"]
    }

  # ---------------------------------------------------------------------------
  # Vault Raft snapshot
  # ---------------------------------------------------------------------------
  davtro-snapshot.hcl: |
    # Vault 1.17:
    # operator raft snapshot save
    # korzysta z:
    #   sys/storage/raft/snapshot
    #
    # Stara sciezka pozostawiona dla kompatybilnosci.

    path "sys/storage/raft/snapshot" {
      capabilities = ["read", "create", "update", "sudo"]
    }

    path "sys/raft/snapshot" {
      capabilities = ["sudo", "read"]
    }

  # ---------------------------------------------------------------------------
  # Transit
  # ---------------------------------------------------------------------------
  davtro-transit.hcl: |
    path "transit/encrypt/davtro-app" {
      capabilities = ["update"]
    }

    path "transit/decrypt/davtro-app" {
      capabilities = ["update"]
    }

    path "transit/rewrap/davtro-app" {
      capabilities = ["update"]
    }

    path "transit/datakey/davtro-app" {
      capabilities = ["update"]
    }

    path "davtro/data/*" {
      capabilities = ["read"]
    }

    path "database/creds/davtro-app-rw" {
      capabilities = ["read"]
    }

  # ---------------------------------------------------------------------------
  # mTLS dla uslug aplikacyjnych
  # ---------------------------------------------------------------------------
  davtro-mtls.hcl: |
    path "davtro/data/*" {
      capabilities = ["read"]
    }

    path "database/creds/davtro-app-rw" {
      capabilities = ["read"]
    }

    path "transit/encrypt/davtro-app" {
      capabilities = ["update"]
    }

    path "transit/decrypt/davtro-app" {
      capabilities = ["update"]
    }

    path "transit/datakey/davtro-app" {
      capabilities = ["update"]
    }

  # ---------------------------------------------------------------------------
  # Vault PKI - ingress
  # ---------------------------------------------------------------------------
  pki-issuer.hcl: |
    path "pki/sign/davtro-ingress" {
      capabilities = ["create", "update"]
    }

    path "pki/issue/davtro-ingress" {
      capabilities = ["create", "update"]
    }

  # ---------------------------------------------------------------------------
  # Vault PKI - Istio / certyfikaty wewnetrzne
  # ---------------------------------------------------------------------------
  pki-internal.hcl: |
    path "pki/sign/davtro-istio-ca" {
      capabilities = ["create", "update"]
    }

    path "pki/issue/davtro-istio-ca" {
      capabilities = ["create", "update"]
    }

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: davtro02-vault-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: davtro-sa
    namespace: davtro02

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-bootstrap
  namespace: davtro02
rules:

  # odczyt podow
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list

  # kubectl exec do postgres
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create

  # odczyt secretow - bootstrap sprawdza ESO
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list

  # restart wybranych deploymentow
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-bootstrap
  namespace: davtro02
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-bootstrap
subjects:
  - kind: ServiceAccount
    name: davtro-sa
    namespace: davtro02

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-bootstrap
  namespace: davtro02
spec:
  replicas: 1

  selector:
    matchLabels:
      app: vault-bootstrap

  template:
    metadata:
      labels:
        app: vault-bootstrap

    spec:
      serviceAccountName: davtro-sa

      # Kyverno/PSA moze wymuszac runAsNonRoot.
      # Vault CLI dziala jako UID 100.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000

      # -----------------------------------------------------------------------
      # kubectl
      # -----------------------------------------------------------------------
      initContainers:
        - name: fetch-kubectl
          image: docker.io/alpine/k8s:1.36.4

          command:
            - sh
            - -c
            - |
              set -eu

              test -x /usr/bin/kubectl

              cp /usr/bin/kubectl /share/kubectl
              chmod 0755 /share/kubectl

              echo "kubectl copied to /share/kubectl"

          volumeMounts:
            - name: tools
              mountPath: /share

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      # -----------------------------------------------------------------------
      # bootstrap
      # -----------------------------------------------------------------------
      containers:
        - name: ensure
          image: hashicorp/vault:1.17

          env:

            # Vault API tylko HTTPS.
            - name: VAULT_ADDR
              value: "https://vault.davtro02.svc.cluster.local:8203"

            # CA z cert-manager.
            - name: VAULT_CACERT
              value: "/etc/vault-tls/ca.crt"

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -u

              KUBECTL=/share/kubectl
              KEYS=/vault/data/bootstrap-keys

              log() {
                echo "[bootstrap] $*"
              }

              # ----------------------------------------------------------------
              # Bezpieczne odczytywanie true/false z vault status JSON.
              # Nie wymaga jq.
              # ----------------------------------------------------------------
              json_bool() {
                key="$1"

                printf '%s\n' "$STATUS" \
                  | tr -d '\n' \
                  | sed -n "s/.*\"${key}\"[[:space:]]*:[[:space:]]*\\(true\\|false\\).*/\\1/p"
              }

              # ----------------------------------------------------------------
              # vault status
              #
              # Vault CLI:
              #   0 = initialized/unsealed
              #   1 = error
              #   2 = sealed
              #
              # Dla bootstrapu 0 i 2 oznaczaja, ze Vault odpowiada.
              # ----------------------------------------------------------------
              read_status() {
                STATUS_FILE=$(mktemp /tmp/vault-status.XXXXXX)

                if vault status -format=json >"${STATUS_FILE}" 2>&1; then
                  STATUS_RC=0
                else
                  STATUS_RC=$?
                fi

                STATUS=$(cat "${STATUS_FILE}" 2>/dev/null || printf '{}')
                rm -f "${STATUS_FILE}"

                [ "${STATUS_RC}" -eq 0 ] || [ "${STATUS_RC}" -eq 2 ]
              }

              # ----------------------------------------------------------------
              # Odczyt unseal key + root token.
              #
              # vault operator init -format=json moze zwrocic JSON jako
              # wieloliniowy dokument. Najpierw usuwamy CR/LF.
              # ----------------------------------------------------------------
              extract_unseal_key() {
                printf '%s\n' "$1" \
                  | tr -d '\r\n' \
                  | sed -n 's/.*"unseal_keys_b64"[[:space:]]*:[[:space:]]*\[[[:space:]]*"\\([^"]*\\)".*/\1/p'
              }

              extract_root_token() {
                printf '%s\n' "$1" \
                  | tr -d '\r\n' \
                  | sed -n 's/.*"root_token"[[:space:]]*:[[:space:]]*"\\([^"]*\\)".*/\1/p'
              }

              # ----------------------------------------------------------------
              # Sprawdzenie czy plik bootstrap-keys jest poprawny.
              # ----------------------------------------------------------------
              valid_bootstrap_keys() {
                [ -s "$KEYS" ] || return 1

                UKEY_CHECK=$(sed -n '1p' "$KEYS" 2>/dev/null || true)
                RTOKEN_CHECK=$(sed -n '2p' "$KEYS" 2>/dev/null || true)

                [ -n "$UKEY_CHECK" ] || return 1
                [ -n "$RTOKEN_CHECK" ] || return 1

                return 0
              }

              # ----------------------------------------------------------------
              # Glowne self-heal.
              # ----------------------------------------------------------------
              ensure_one() {

                # ================================================================
                # 1. Czekamy az Vault zacznie odpowiadac po TLS.
                # ================================================================
                n=0

                while ! read_status; do
                  n=$((n + 1))

                  if [ "$n" -ge 20 ]; then
                    log "Vault nie odpowiada przez TLS."
                    log "ostatni rc=${STATUS_RC:-unknown}"
                    log "status=${STATUS:-{}}"
                    return 1
                  fi

                  sleep 3
                done

                INIT=$(json_bool initialized)
                SEALED=$(json_bool sealed)

                if [ -z "$INIT" ]; then
                  log "Nieparsowalny status Vaulta:"
                  log "$STATUS"
                  return 1
                fi

                log "Vault status: initialized=${INIT}, sealed=${SEALED}"

                # ================================================================
                # 2. INIT
                # ================================================================
                if [ "$INIT" != "true" ]; then

                  log "Vault nie jest zainicjalizowany."

                  # Nie uruchamiamy init drugi raz.
                  INIT_JSON=$(vault operator init \
                    -key-shares=1 \
                    -key-threshold=1 \
                    -format=json 2>/dev/null) || {
                      log "vault operator init nieudany - retry"
                      return 1
                    }

                  UKEY=$(extract_unseal_key "$INIT_JSON")
                  RTOKEN=$(extract_root_token "$INIT_JSON")

                  if [ -z "$UKEY" ] || [ -z "$RTOKEN" ]; then
                    log "Nie udalo sie wyciagnac unseal key/root token z init."

                    # Nie nadpisujemy niczego niepelna informacja.
                    return 1
                  fi

                  # Najpierw plik tymczasowy.
                  TMP_KEYS="${KEYS}.tmp"

                  umask 077

                  printf '%s\n%s\n' \
                    "$UKEY" \
                    "$RTOKEN" \
                    > "$TMP_KEYS"

                  chmod 600 "$TMP_KEYS"

                  mv "$TMP_KEYS" "$KEYS"

                  log "Vault initialized."
                  log "bootstrap-keys zapisany na PVC."

                  # ==============================================================
                  # KLUCZOWA POPRAWKA:
                  # status pobieramy ponownie po init.
                  # ==============================================================
                  if ! read_status; then
                    log "Vault nie odpowiada po init - retry"
                    return 1
                  fi

                  INIT=$(json_bool initialized)
                  SEALED=$(json_bool sealed)

                  log "Po init: initialized=${INIT}, sealed=${SEALED}"
                fi

                # ================================================================
                # 3. Jeżeli Vault był inicjalizowany recznie - wymagamy kluczy.
                # ================================================================
                if ! valid_bootstrap_keys; then
                  log "Brak poprawnego $KEYS."
                  log "Vault jest zainicjalizowany, ale bootstrap nie ma unseal key."
                  log "Self-heal zatrzymany - wymagana jednorazowa migracja klucza."
                  return 1
                fi

                UKEY=$(sed -n '1p' "$KEYS")
                RTOKEN=$(sed -n '2p' "$KEYS")

                # ================================================================
                # 4. UNSEAL
                # ================================================================
                if [ "$SEALED" = "true" ]; then

                  log "Vault sealed -> unseal."

                  vault operator unseal "$UKEY" >/dev/null 2>&1 || {
                    log "unseal nieudany - retry"
                    return 1
                  }

                  # Po unseal ponownie pobieramy status.
                  if ! read_status; then
                    log "Nie mozna odczytac statusu po unseal."
                    return 1
                  fi

                  SEALED=$(json_bool sealed)

                  log "Po unseal: sealed=${SEALED}"
                fi

                if [ "$SEALED" != "false" ]; then
                  log "Vault nadal sealed."
                  return 1
                fi

                # ================================================================
                # 5. Root token
                # ================================================================
                export VAULT_TOKEN="$RTOKEN"

                if ! vault token lookup -format=json >/dev/null 2>&1; then
                  log "Root token z bootstrap-keys jest nieaktualny."
                  log "Konfiguracja Vaulta wstrzymana."
                  return 1
                fi

                log "Root token OK."

                # ================================================================
                # 6. AUDIT
                # ================================================================
                if ! vault audit list 2>/dev/null | grep -q 'file/'; then
                  log "Wlaczam Vault audit -> stdout."

                  vault audit enable file file_path=stdout >/dev/null 2>&1 || {
                    log "Nie udalo sie wlaczyc audit."
                    return 1
                  }
                fi

                # ================================================================
                # 7. KV v2
                # ================================================================
                if ! vault secrets list 2>/dev/null | grep -q '^davtro/'; then
                  log "Wlaczam KV v2: davtro/."

                  vault secrets enable \
                    -path=davtro \
                    kv-v2 >/dev/null || {
                      log "Nie udalo sie wlaczyc KV davtro."
                      return 1
                    }
                fi

                # ================================================================
                # 8. DB PASSWORD
                # ================================================================
                ALIGN=0

                if ! vault kv get davtro/db >/dev/null 2>&1; then

                  log "Brak davtro/db -> generuje DB_PASSWORD."

                  PGPASS=$(
                    head -c 64 /dev/urandom \
                    | base64 \
                    | tr -dc 'A-Za-z0-9' \
                    | head -c 32
                  )

                  if [ -z "$PGPASS" ]; then
                    PGPASS="Davtro$(date +%s)x1"
                  fi

                  vault kv put davtro/db \
                    DB_USER=davtro \
                    DB_PASSWORD="$PGPASS" >/dev/null

                  ALIGN=1

                  log "DB_PASSWORD wygenerowany i zapisany w Vault."
                fi

                # ================================================================
                # 9. SMTP
                # ================================================================
                if ! vault kv get davtro/smtp >/dev/null 2>&1; then

                  vault kv put davtro/smtp \
                    SMTP_USER='' \
                    SMTP_PASSWORD='' >/dev/null

                  log "Utworzono davtro/smtp."
                fi

                # ================================================================
                # 10. ADMIN PASSWORD
                # ================================================================
                if ! vault kv get davtro/auth >/dev/null 2>&1; then

                  ADMINPASS=$(
                    head -c 64 /dev/urandom \
                    | base64 \
                    | tr -dc 'A-Za-z0-9' \
                    | head -c 24
                  )

                  if [ -z "$ADMINPASS" ]; then
                    ADMINPASS="DavtroAdmin$(date +%s)x1"
                  fi

                  vault kv put davtro/auth \
                    ADMIN_PASSWORD="$ADMINPASS" >/dev/null

                  log "ADMIN_PASSWORD wygenerowany w Vault."
                fi

                # ================================================================
                # 11. Kubernetes Auth
                # ================================================================
                if ! vault auth list 2>/dev/null | grep -q '^kubernetes/'; then
                  log "Wlaczam Kubernetes Auth."

                  vault auth enable kubernetes >/dev/null || {
                    log "Nie mozna wlaczyc Kubernetes Auth."
                    return 1
                  }
                fi

                vault write auth/kubernetes/config \
                  kubernetes_host="https://kubernetes.default.svc" \
                  kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  disable_iss_validation=true >/dev/null || {
                    log "Nie mozna skonfigurowac Kubernetes Auth."
                    return 1
                  }

                # ================================================================
                # 12. ESO policy
                # ================================================================
                vault policy write \
                  davtro-apps \
                  /sql/davtro-apps.hcl >/dev/null || {
                    log "Nie mozna zapisac policy davtro-apps."
                    return 1
                  }

                vault write \
                  auth/kubernetes/role/davtro-apps \
                  bound_service_account_names=davtro-sa \
                  bound_service_account_namespaces=davtro02 \
                  policies=davtro-apps \
                  ttl=1h >/dev/null || {
                    log "Nie mozna utworzyc role davtro-apps."
                    return 1
                  }

                # ================================================================
                # 13. Database Engine
                # ================================================================
                DB_PASSWORD=$(vault kv get \
                  -field=DB_PASSWORD \
                  davtro/db 2>/dev/null) || {
                    log "Nie mozna odczytac DB_PASSWORD."
                    return 1
                  }

                if ! vault secrets list 2>/dev/null | grep -q '^database/'; then

                  log "Wlaczam Database Engine."

                  vault secrets enable database >/dev/null || {
                    log "Nie mozna wlaczyc Database Engine."
                    return 1
                  }
                fi

                # ================================================================
                # 14. Database connection
                #
                # Jezeli PostgreSQL jeszcze nie dziala:
                #   - NIE konczymy bootstrapu jako fatalnego bledu Vaulta
                #   - wracamy do petli self-heal
                #
                # ESO moze wtedy utworzyc davtro-secrets.
                # PostgreSQL wystartuje.
                # Kolejna iteracja zrobi ALIGN.
                # ================================================================
                if ! vault write \
                  database/config/davtro-postgresql \
                  plugin_name=postgresql-database-plugin \
                  allowed_roles=davtro-app-rw \
                  connection_url="postgresql://{{username}}:{{password}}@postgres-clusterip.davtro02.svc.cluster.local:5432/davtro_rentals?sslmode=disable" \
                  username=davtro \
                  password="$DB_PASSWORD" >/dev/null 2>&1; then

                  log "PostgreSQL jeszcze niedostepny."

                  # Sprawdzamy czy pod istnieje.
                  if ! $KUBECTL -n davtro02 get pod postgres-db-0 >/dev/null 2>&1; then
                    log "postgres-db-0 jeszcze nie istnieje."
                  else
                    log "postgres-db-0 istnieje, ale nie przyjmuje polaczen."
                  fi

                  log "Pomijam ALIGN w tej iteracji."
                  log "Nastepna proba za 60s."

                  return 1
                fi

                log "Database Engine polaczony z PostgreSQL."

                # ================================================================
                # 15. ALIGN DB PASSWORD
                #
                # Tylko gdy PostgreSQL juz dziala.
                # ================================================================
                if [ "$ALIGN" = "1" ]; then

                  log "ALIGN: synchronizuje haslo davtro."

                  if $KUBECTL -n davtro02 exec postgres-db-0 -- \
                    psql -U davtro -d davtro_rentals -tAc \
                    "ALTER USER davtro WITH PASSWORD '$DB_PASSWORD';" \
                    >/dev/null 2>&1; then

                    log "Haslo PostgreSQL zsynchronizowane z Vault KV."

                    # Ponownie konfigurujemy database engine
                    # juz z poprawnym haslem.
                    vault write \
                      database/config/davtro-postgresql \
                      plugin_name=postgresql-database-plugin \
                      allowed_roles=davtro-app-rw \
                      connection_url="postgresql://{{username}}:{{password}}@postgres-clusterip.davtro02.svc.cluster.local:5432/davtro_rentals?sslmode=disable" \
                      username=davtro \
                      password="$DB_PASSWORD" >/dev/null || {
                        log "Nie mozna zapisac konfiguracji Database Engine."
                        return 1
                      }

                  else
                    log "ALTER USER nieudany."
                    log "Postgres nie jest jeszcze gotowy."
                    log "ALIGN ponowiony za 60s."
                    return 1
                  fi

                  # ==============================================================
                  # 16. Czekamy na ESO
                  # ==============================================================
                  n=0

                  while true; do

                    CURRENT_ESO_PASSWORD=$(
                      $KUBECTL -n davtro02 get secret davtro-secrets \
                        -o jsonpath='{.data.DB_PASSWORD}' \
                        2>/dev/null \
                        | base64 -d 2>/dev/null || true
                    )

                    if [ "$CURRENT_ESO_PASSWORD" = "$DB_PASSWORD" ]; then
                      log "ESO odswiezyl davtro-secrets."
                      break
                    fi

                    n=$((n + 1))

                    if [ "$n" -ge 40 ]; then
                      log "ESO nie odswiezyl davtro-secrets w czasie oczekiwania."
                      log "Nie przerywam Vault bootstrapu."
                      break
                    fi

                    log "Czekam na ESO ($n/40)."

                    sleep 15
                  done

                  # ==============================================================
                  # 17. Restart zaleznosci
                  # ==============================================================
                  $KUBECTL -n davtro02 rollout restart \
                    deploy/pgadmin \
                    deploy/postgres-exporter \
                    deploy/spring-app-deployment \
                    >/dev/null 2>&1 || true

                  log "Restart pgadmin/postgres-exporter/spring wykonany."
                fi

                # ================================================================
                # 18. bookings schema
                # ================================================================
                #
                # Wykonujemy dopiero gdy PostgreSQL odpowiada.
                #
                if ! $KUBECTL -n davtro02 exec postgres-db-0 -- \
                  psql -U davtro -d davtro_rentals -tAc \
                  "ALTER TABLE bookings ADD COLUMN IF NOT EXISTS user_id INT;
                   ALTER TABLE bookings ADD COLUMN IF NOT EXISTS username VARCHAR(100);" \
                  >/dev/null 2>&1; then

                  log "ALTER TABLE bookings nieudany."
                  log "PostgreSQL jeszcze niegotowy."
                  return 1
                fi

                log "Schema bookings OK."

                # ================================================================
                # 19. Database dynamic role
                # ================================================================
                vault write \
                  database/roles/davtro-app-rw \
                  db_name=davtro-postgresql \
                  creation_statements=@/sql/creation.sql \
                  revocation_statements=@/sql/revocation.sql \
                  default_ttl=1h \
                  max_ttl=24h >/dev/null || {
                    log "Nie mozna utworzyc database role davtro-app-rw."
                    return 1
                  }

                # ================================================================
                # 20. Snapshot policy
                # ================================================================
                vault policy write \
                  davtro-snapshot \
                  /sql/davtro-snapshot.hcl >/dev/null || {
                    log "Nie mozna zapisac policy davtro-snapshot."
                    return 1
                  }

                vault write \
                  auth/kubernetes/role/davtro-snapshot \
                  bound_service_account_names=davtro-sa \
                  bound_service_account_namespaces=davtro02 \
                  policies=davtro-snapshot \
                  ttl=1h >/dev/null || {
                    log "Nie mozna utworzyc role davtro-snapshot."
                    return 1
                  }

                # ================================================================
                # 21. Vault PKI
                # ================================================================
                if ! vault secrets list 2>/dev/null | grep -q '^pki/'; then

                  log "PKI: wlaczam silnik pki."

                  vault secrets enable \
                    -path=pki \
                    pki >/dev/null || {
                      log "Nie mozna wlaczyc PKI."
                      return 1
                    }
                fi

                vault secrets tune \
                  -max-lease-ttl=87600h \
                  pki >/dev/null 2>&1 || true

                # ================================================================
                # 22. Root CA Vault PKI
                # ================================================================
                if ! vault read pki/cert/ca >/dev/null 2>&1; then

                  log "PKI: generuje self-signed root CA."

                  vault write \
                    -field=certificate \
                    pki/root/generate/internal \
                    common_name="davtro-internal CA" \
                    ttl=87600h \
                    key_type=rsa \
                    key_bits=2048 >/dev/null || {
                      log "Nie mozna wygenerowac PKI root CA."
                      return 1
                    }
                fi

                # ================================================================
                # 23. Ingress role
                # ================================================================
                vault write \
                  pki/roles/davtro-ingress \
                  allowed_domains="davtro.local,spark.davtro.local" \
                  allow_subdomains=true \
                  allow_bare_domains=true \
                  max_ttl=2160h \
                  key_type=rsa \
                  key_bits=2048 >/dev/null || {
                    log "Nie mozna skonfigurowac davtro-ingress."
                    return 1
                  }

                # ================================================================
                # 24. Istio CA role
                # ================================================================
                vault write \
                  pki/roles/davtro-istio-ca \
                  allow_any_name=true \
                  enforce_hostnames=false \
                  allow_uri_sans=true \
                  allow_ip_sans=true \
                  allow_subdomains=true \
                  allow_bare_domains=true \
                  is_ca=true \
                  max_ttl=8760h \
                  key_type=ec \
                  key_bits=256 >/dev/null || {
                    log "Nie mozna skonfigurowac davtro-istio-ca."
                    return 1
                  }

                # ================================================================
                # 25. cert-manager ingress policy
                # ================================================================
                vault policy write \
                  pki-issuer \
                  /sql/pki-issuer.hcl >/dev/null || {
                    log "Nie mozna zapisac pki-issuer."
                    return 1
                  }

                vault write \
                  auth/kubernetes/role/cert-manager \
                  bound_service_account_names="cert-manager,cert-manager-vault" \
                  bound_service_account_namespaces="cert-manager" \
                  policies=pki-issuer \
                  ttl=1h >/dev/null || {
                    log "Nie mozna utworzyc role cert-manager."
                    return 1
                  }

                # ================================================================
                # 26. cert-manager internal / Istio policy
                # ================================================================
                vault policy write \
                  pki-internal \
                  /sql/pki-internal.hcl >/dev/null || {
                    log "Nie mozna zapisac pki-internal."
                    return 1
                  }

                vault write \
                  auth/kubernetes/role/cert-manager-internal \
                  bound_service_account_names="cert-manager,cert-manager-vault" \
                  bound_service_account_namespaces="cert-manager" \
                  policies=pki-internal \
                  ttl=1h >/dev/null || {
                    log "Nie mozna utworzyc role cert-manager-internal."
                    return 1
                  }

                # ================================================================
                # 27. Transit
                # ================================================================
                if ! vault secrets list 2>/dev/null | grep -q '^transit/'; then

                  log "Transit: wlaczam engine."

                  vault secrets enable transit >/dev/null || {
                    log "Nie mozna wlaczyc Transit."
                    return 1
                  }
                fi

                if ! vault read transit/keys/davtro-app >/dev/null 2>&1; then

                  log "Transit: tworze klucz davtro-app."

                  vault write -f \
                    transit/keys/davtro-app \
                    type=aes256-gcm96 \
                    auto_rotate_period=720h >/dev/null || {
                      log "Nie mozna utworzyc klucza Transit."
                      return 1
                    }
                fi

                vault policy write \
                  davtro-transit \
                  /sql/davtro-transit.hcl >/dev/null || {
                    log "Nie mozna zapisac policy davtro-transit."
                    return 1
                  }

                vault write \
                  auth/kubernetes/role/davtro-transit \
                  bound_service_account_names=davtro-sa \
                  bound_service_account_namespaces=davtro02 \
                  policies=davtro-transit \
                  ttl=1h >/dev/null || {
                    log "Nie mozna utworzyc role davtro-transit."
                    return 1
                  }

                # ================================================================
                # 28. mTLS
                # ================================================================
                vault policy write \
                  davtro-mtls \
                  /sql/davtro-mtls.hcl >/dev/null || {
                    log "Nie mozna zapisac policy davtro-mtls."
                    return 1
                  }

                vault write \
                  auth/kubernetes/role/davtro-mtls \
                  bound_service_account_names=davtro-sa \
                  bound_service_account_namespaces=davtro02 \
                  policies=davtro-mtls \
                  ttl=1h >/dev/null || {
                    log "Nie mozna utworzyc role davtro-mtls."
                    return 1
                  }

                # ================================================================
                # 29. DONE
                # ================================================================
                log "=================================================="
                log "DONE - Vault skonfigurowany."
                log "KV + Kubernetes Auth + Database + PKI + Transit + mTLS"
                log "=================================================="

                return 0
              }

              # ------------------------------------------------------------------
              # SELF-HEAL
              #
              # Nie jest hookiem ArgoCD.
              # Deployment pozostaje uruchomiony i sprawdza Vault co 60 sekund.
              # ------------------------------------------------------------------
              while true; do

                if ensure_one; then
                  log "OK - nastepny check za 60s."
                else
                  log "BLAD - retry za 60s."
                fi

                sleep 60
              done

          volumeMounts:

            # Ten sam PVC co Vault StatefulSet.
            - name: vault-data
              mountPath: /vault/data

            # Policy/SQL z ConfigMap.
            - name: sql
              mountPath: /sql
              readOnly: true

            # kubectl z initContainera.
            - name: tools
              mountPath: /share
              readOnly: true

            # Bootstrapowy certyfikat Vaulta.
            - name: vault-tls
              mountPath: /etc/vault-tls
              readOnly: true

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi

      volumes:

        # -----------------------------------------------------------------------
        # Vault PVC
        # -----------------------------------------------------------------------
        - name: vault-data
          persistentVolumeClaim:
            claimName: vault-data-vault-0

        # -----------------------------------------------------------------------
        # Policy
        # -----------------------------------------------------------------------
        - name: sql
          configMap:
            name: vault-bootstrap-sql

        # -----------------------------------------------------------------------
        # kubectl
        # -----------------------------------------------------------------------
        - name: tools
          emptyDir: {}

        # -----------------------------------------------------------------------
        # Bootstrap TLS.
        #
        # UWAGA:
        # Secret vault-tls MUSI byc utworzony przez cert-manager.
        # -----------------------------------------------------------------------
        - name: vault-tls
          secret:
            secretName: vault-tls