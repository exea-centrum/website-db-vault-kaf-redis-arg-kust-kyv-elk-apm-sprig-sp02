# ISTIO: zastepuje ingress-nginx (Ingress davtro-ingress + spark-ingress).
# TLS terminuje Istio Ingress Gateway (istio-system) certem z cert-managera
# (Secret davtro-gateway-tls, patrz manifests/istio-system/gateway-certificate.yaml).
#
# Routing: per HOST (nie subpath), bo pgAdmin i Kafka UI NIE obsluguja subpath
# (zwracaja 404 na /pgadmin/ i /kafka-ui/). Wyjatki:
#   - FastAPI: /api/*   (dziala natywnie pod subpath)
#   - frontend: /       (dziala natywnie pod /)
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: davtro-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: davtro02
spec:
  selector:
    istio: ingressgateway
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts:
        - "davtro.local"
        - "spark.davtro.local"
        - "kafka-ui.davtro.local"
        - "grafana.davtro.local"
        - "pgadmin.davtro.local"
        - "tempo.davtro.local"
        - "prometheus.davtro.local"
        - "loki.davtro.local"
        - "spring.davtro.local"
      tls:
        httpsRedirect: true
    - port: { number: 443, name: https, protocol: HTTPS }
      hosts:
        - "davtro.local"
        - "spark.davtro.local"
        - "kafka-ui.davtro.local"
        - "grafana.davtro.local"
        - "pgadmin.davtro.local"
        - "tempo.davtro.local"
        - "prometheus.davtro.local"
        - "loki.davtro.local"
        - "spring.davtro.local"
      tls:
        mode: SIMPLE
        credentialName: davtro-gateway-tls
        minProtocolVersion: TLSV1_2
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: davtro-routes
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: davtro02
spec:
  hosts: ["davtro.local"]
  gateways: ["davtro-gateway"]
  http:
    - match: [{ uri: { prefix: /api } }]
      route: [{ destination: { host: fastapi-web-app-svc, port: { number: 80 } } }]
    - route: [{ destination: { host: frontend-svc, port: { number: 80 } } }]
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: spark-routes
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: davtro02
spec:
  hosts: ["spark.davtro.local"]
  gateways: ["davtro-gateway"]
  http:
    - route: [{ destination: { host: spark-master-svc, port: { number: 8082 } } }]
---
