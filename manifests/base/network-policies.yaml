apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: davtro02
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: davtro02
spec:
  podSelector: {}
  ingress:
    - from: [{ podSelector: {} }]
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eso-to-vault
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: davtro02
spec:
  podSelector:
    matchLabels:
      app: vault
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - { protocol: TCP, port: 8203 }
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-web
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: davtro02
spec:
  podSelector: { matchLabels: { app: fastapi-web-app } }
  ingress:
    - from: []
      ports: [{ protocol: TCP, port: 8080 }]
  policyTypes: [Ingress]
---
