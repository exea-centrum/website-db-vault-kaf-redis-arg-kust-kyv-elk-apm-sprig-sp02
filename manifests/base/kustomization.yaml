apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# KROK 5 (PKI): Vault CA + cert-manager. AKTYWNE - cert-manager zainstalowany
# na klastrze (CRD ClusterIssuer/Certificate istnieja, SA cert-manager-vault +
# Secret cert-manager-vault-token gotowe). Kolejnosc celowa: issuer przed certami.
#
# UWAGA: namespace.yaml MUSI byc pierwszy - namespace tworzony przed reszta zasobow.
resources:
- namespace.yaml
- serviceaccount.yaml
- configmap.yaml
- secret-store.yaml
- external-secrets.yaml
- external-secrets-db-dynamic.yaml
- deployment.yaml
- service.yaml
- frontend.yaml
- hpa.yaml
- pdb.yaml
- postgres.yaml
- redis.yaml
- vault.yaml
- vault-snapshot.yaml
- vault-bootstrap.yaml
- kafka.yaml
- message-processor.yaml
- spring-app.yaml
- spark.yaml
- prometheus.yaml
- cert-expiry-exporter.yaml
- alertmanager.yaml
- exporters.yaml
- grafana.yaml
- loki.yaml
- promtail.yaml
- tempo.yaml
- pgadmin.yaml
- kafka-ui.yaml
- network-policies.yaml
- ingress.yaml
- kyverno-policy.yaml
- pki-issuer.yaml
- vault-server-tls.yaml
- certificates.yaml
- mtls-certificates.yaml
- transit-helpers.yaml

# UWAGA: kazda pozycja MUSI miec 'name', 'newName' i 'newTag'.
# CI (kustomize edit set image) nadpisuje 'newTag' tagiem SHA commita.
# Kolejnosc jest dowolna, ale utrzymujemy ja stala dla czytelnych diffow.
