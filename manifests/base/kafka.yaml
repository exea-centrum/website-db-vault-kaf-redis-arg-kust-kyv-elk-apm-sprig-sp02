# Kafka KRaft (bez Zookeepera) - wersja ISTIO.
# Szyfrowanie i uwierzytelnianie klientow robi mesh (mTLS Envoy), NIE broker:
#   - brak listenera SSL :9094, brak keystore/truststore, brak initContainerow openssl/keytool,
#   - klienci lacza sie PLAINTEXT na :9092, Envoy opakowuje to w mTLS (TLS 1.3, certy w RAM sidecara),
#   - kto moze rozmawiac z brokerem decyduje AuthorizationPolicy (istio-security.yaml).
# :9093 to kanal controllera KRaft - quorum wskazuje na localhost, wiec ruch nie opuszcza poda.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-kraft
  namespace: davtro02
spec:
  serviceName: kafka-kraft
  replicas: 1
  selector: { matchLabels: { app: kafka-kraft } }
  template:
    metadata: { labels: { app: kafka-kraft } }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - { name: broker, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk" }
            - { name: KAFKA_NODE_ID, value: "0" }
            - { name: KAFKA_PROCESS_ROLES, value: "controller,broker" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-kraft:9092" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "0@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_LOG_DIRS, value: "/tmp/kraft-combined-logs" }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          volumeMounts:
            - { name: kafka-data, mountPath: /tmp/kraft-combined-logs }
  volumeClaimTemplates:
    - metadata: { name: kafka-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-kraft
  namespace: davtro02
spec:
  clusterIP: None
  selector: { app: kafka-kraft }
  ports:
    # prefiks tcp- = Istio traktuje jako czysty TCP (bez sniffingu protokolu)
    - { name: tcp-broker, port: 9092, targetPort: 9092 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-job
  namespace: davtro02
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: kafka-topic-init
    spec:
      serviceAccountName: kafka-job-sa
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kafka-topic-init
          image: apache/kafka:3.7.0
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
          command:
            - /bin/bash
            - -c
            - |
              # ISTIO: Job MUSI miec sidecar (STRICT mTLS), a sidecar nie konczy sie sam z Jobem.
              # holdApplicationUntilProxyStarts (patch w kustomization.yaml) - proxy gotowe przed startem.
              # Proxy zamykamy dopiero po SUKCESIE (przy bledzie OnFailure restartuje kontener z dzialajacym proxy).
              fail=0
              for t in bookings-created email-invoices marketing-actions; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-kraft:9092 --create --if-not-exists --topic "$t" --partitions 3 --replication-factor 1 || fail=1
              done
              if [ "$fail" -eq 0 ]; then
                wget -q -O /dev/null --post-data='' http://127.0.0.1:15020/quitquitquit || true
              fi
              exit $fail

